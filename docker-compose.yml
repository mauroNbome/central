services:
  db:
    image: postgres:17-alpine
    container_name: hub_db
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "5433:5432"
    volumes:
      - hub_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hub_db_data:
