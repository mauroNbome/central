packages:
  - apps/*
  - modules/*
  - packages/*

# pnpm 11 bloquea los scripts de instalación por defecto. esbuild lo necesitan
# tsx, vite y drizzle-kit.
allowBuilds:
  esbuild: true

# Versiones compartidas en un solo lugar: los package.json usan "catalog:".
catalog:
  typescript: ^7.0.2
  vitest: ^5.0.5
  turbo: ^2.11.8
  zod: ^4.6.7
  hono: ^4.13.13
  "@hono/node-server": ^2.1.5
  "@hono/zod-validator": ^0.9.1
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  postgres: ^3.4.9
  tsx: ^4.23.15
  "@types/node": ^24.19.2
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  "@tanstack/react-query": ^5.104.3

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/react-query@5.104.3'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - react-dom@19.3.1
  - react@19.3.1
  - vitest@5.0.5
